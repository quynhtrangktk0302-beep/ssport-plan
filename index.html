<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ssport — Kế Hoạch & Tiến Độ Công Việc</title>
  <meta name="description" content="Bảng theo dõi kế hoạch kinh doanh và checklist công việc Ssport - Tối giản, trực quan, hỗ trợ chỉnh sửa trực tiếp">

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Merriweather:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ==========================================================================
       CLEAN EXECUTIVE DESIGN SYSTEM (SHEEPA / MINIMALIST HYBRID)
       ========================================================================== */
    :root {
      --bg-page: #FBF9F5;
      --bg-card: #FFFFFF;
      --bg-subtle: #F3EFEA;
      --bg-hover: #ECE6DE;
      
      --border-subtle: #E8E2D9;
      --border-strong: #D5CCC0;

      --text-main: #24201D;
      --text-muted: #6B635B;
      --text-faint: #9C9388;

      /* Ssport Deep Forest Green */
      --brand: #244C37;
      --brand-hover: #1A3728;
      --brand-light: rgba(36, 76, 55, 0.08);

      /* Soft Pastel Status Tokens */
      --status-overdue-bg: #FEF2F2;
      --status-overdue-txt: #991B1B;
      --status-overdue-border: #FCA5A5;
      --status-overdue-dot: #DC2626;

      --status-doing-bg: #F0F9FF;
      --status-doing-txt: #075985;
      --status-doing-border: #BAE6FD;
      --status-doing-dot: #0284C7;

      --status-sched-bg: #F8FAFC;
      --status-sched-txt: #475569;
      --status-sched-border: #E2E8F0;
      --status-sched-dot: #94A3B8;

      --status-done-bg: #F0FDF4;
      --status-done-txt: #166534;
      --status-done-border: #BBF7D0;
      --status-done-dot: #16A34A;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;

      --shadow-soft: 0 2px 8px rgba(36, 32, 29, 0.04);
      --shadow-hover: 0 6px 18px rgba(36, 32, 29, 0.08);

      --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --font-serif: 'Merriweather', Georgia, serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    [data-theme="sepia"] {
      --bg-page: #F4ECD8;
      --bg-card: #FAF4E8;
      --bg-subtle: #E8DCBE;
      --bg-hover: #DCCEAA;
      --border-subtle: #E0D2B4;
      --border-strong: #C8B793;
      --text-main: #362B20;
      --text-muted: #6E5F50;
      --text-faint: #968674;
      --brand: #693E20;
      --brand-hover: #523018;
      --brand-light: rgba(105, 62, 32, 0.1);
    }

    [data-theme="dark"] {
      --bg-page: #141518;
      --bg-card: #1F2127;
      --bg-subtle: #272B33;
      --bg-hover: #323742;
      --border-subtle: #2F3440;
      --border-strong: #3F4656;
      --text-main: #F1F3F5;
      --text-muted: #A6ADBB;
      --text-faint: #6B7280;
      --brand: #4E9A70;
      --brand-hover: #63B285;
      --brand-light: rgba(78, 154, 112, 0.15);

      --status-overdue-bg: #2D1517;
      --status-overdue-txt: #FCA5A5;
      --status-overdue-border: #5C1D20;

      --status-doing-bg: #10263B;
      --status-doing-txt: #93C5FD;
      --status-doing-border: #1E40AF;

      --status-sched-bg: #21252D;
      --status-sched-txt: #94A3B8;
      --status-sched-border: #333945;

      --status-done-bg: #122B1E;
      --status-done-txt: #86EFAC;
      --status-done-border: #14532D;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.5;
      padding-bottom: 90px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* TOP BAR / NAV */
    .top-nav {
      padding: 24px 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 20px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: var(--brand);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }

    .brand-name {
      font-family: var(--font-serif);
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
    }

    .brand-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .month-select-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: var(--shadow-soft);
    }

    .month-select-pill select {
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--brand);
      cursor: pointer;
      outline: none;
    }

    .theme-pill-group {
      display: flex;
      background: var(--bg-subtle);
      border-radius: 8px;
      padding: 3px;
      gap: 2px;
    }

    .theme-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .theme-btn.active {
      background: var(--bg-card);
      color: var(--text-main);
      box-shadow: var(--shadow-soft);
    }

    .btn-text-icon {
      padding: 7px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }
    .btn-text-icon:hover {
      background: var(--bg-hover);
      color: var(--text-main);
    }

    /* COMPACT KPI BAR (THƯỚC ĐO TIẾN ĐỘ 1 HÀNG) */
    .kpi-strip {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 14px 20px;
      margin-bottom: 22px;
      box-shadow: var(--shadow-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .kpi-metrics-wrap {
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
    }

    .kpi-metric-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .kpi-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .kpi-metric-item .label {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .kpi-metric-item .val {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 1rem;
      color: var(--text-main);
    }

    .kpi-progress-bar-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 220px;
    }

    .kpi-bar-track {
      flex: 1;
      height: 8px;
      background: var(--bg-subtle);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
    }

    .kpi-bar-fill-done { background: #16A34A; }
    .kpi-bar-fill-doing { background: #0284C7; }
    .kpi-bar-fill-overdue { background: #DC2626; }
    .kpi-bar-fill-sched { background: #CBD5E1; }

    /* AVATAR BAR - CHỌN NHANH NHÂN SỰ */
    .avatar-filter-section {
      margin-bottom: 20px;
    }

    .avatar-filter-title {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-faint);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .avatar-chips-track {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: thin;
    }

    .avatar-chip {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 30px;
      padding: 6px 14px 6px 8px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
      white-space: nowrap;
      box-shadow: var(--shadow-soft);
    }

    .avatar-chip:hover {
      border-color: var(--brand);
      background: var(--bg-hover);
    }

    .avatar-chip.active {
      background: var(--brand);
      color: #FFFFFF;
      border-color: var(--brand);
    }

    .avatar-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--bg-subtle);
      color: var(--text-main);
      font-weight: 700;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-chip.active .avatar-circle {
      background: rgba(255, 255, 255, 0.2);
      color: #FFFFFF;
    }

    .avatar-name {
      font-size: 0.86rem;
      font-weight: 600;
    }

    .avatar-badge-count {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      padding: 1px 6px;
      border-radius: 10px;
      background: var(--bg-subtle);
      color: var(--text-muted);
    }

    .avatar-chip.active .avatar-badge-count {
      background: rgba(255, 255, 255, 0.25);
      color: #FFFFFF;
    }

    /* CONTROLS & VIEW SELECTOR */
    .toolbar-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .search-input-wrap {
      position: relative;
      flex: 1;
      max-width: 360px;
      min-width: 240px;
    }

    .search-input-wrap i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-faint);
      font-size: 0.9rem;
    }

    .search-field {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 0.88rem;
      outline: none;
    }

    .search-field:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px var(--brand-light);
    }

    .secondary-filters {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .filter-select {
      padding: 8px 12px;
      border-radius: 9px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 0.82rem;
      font-weight: 500;
      outline: none;
      cursor: pointer;
    }

    .view-switcher {
      display: flex;
      background: var(--bg-subtle);
      border-radius: 10px;
      padding: 3px;
      gap: 2px;
    }

    .view-btn {
      border: none;
      background: transparent;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .view-btn.active {
      background: var(--bg-card);
      color: var(--text-main);
      box-shadow: var(--shadow-soft);
    }

    /* ==========================================================================
       VIEW 1: FOCUS / URGENCY SECTIONS (CỰC KỲ DỄ NHÌN)
       ========================================================================== */
    .focus-group {
      margin-bottom: 28px;
    }

    .focus-group-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .focus-icon-circle {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
    }

    .focus-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .focus-count {
      font-family: var(--font-mono);
      font-size: 0.76rem;
      padding: 2px 7px;
      border-radius: 10px;
      background: var(--bg-subtle);
      color: var(--text-muted);
      font-weight: 600;
    }

    .task-cards-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-card-row {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: var(--shadow-soft);
      position: relative;
    }

    .task-card-row:hover {
      border-color: var(--brand);
      transform: translateY(-1px);
      box-shadow: var(--shadow-hover);
    }

    .task-card-row.is-done {
      opacity: 0.55;
      background: var(--bg-subtle);
    }

    .task-card-row.is-done .task-name {
      text-decoration: line-through;
    }

    .task-left-col {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .task-checkbox-custom {
      width: 19px;
      height: 19px;
      accent-color: var(--brand);
      cursor: pointer;
      flex-shrink: 0;
    }

    .task-stt {
      font-family: var(--font-mono);
      font-size: 0.76rem;
      color: var(--text-faint);
      font-weight: 600;
      width: 32px;
      flex-shrink: 0;
    }

    .task-title-wrap {
      flex: 1;
      min-width: 0;
    }

    .task-name {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .task-meta-sub {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 3px;
      font-size: 0.76rem;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .project-pill {
      background: var(--bg-subtle);
      padding: 1px 7px;
      border-radius: 4px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .task-right-col {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .assignee-avatar-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .assignee-badge {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--brand-light);
      color: var(--brand);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .deadline-badge {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .deadline-badge.overdue {
      background: var(--status-overdue-bg);
      color: var(--status-overdue-txt);
      border: 1px solid var(--status-overdue-border);
    }

    .deadline-badge.normal {
      background: var(--bg-subtle);
      color: var(--text-muted);
    }

    .edited-indicator {
      font-size: 0.7rem;
      color: #D97706;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: #FEF3C7;
      padding: 1px 6px;
      border-radius: 4px;
    }

    /* ==========================================================================
       VIEW 2: WEEKLY TIMELINE (THEO TUẦN)
       ========================================================================== */
    .timeline-week-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      margin-bottom: 20px;
      overflow: hidden;
      box-shadow: var(--shadow-soft);
    }

    .timeline-week-header {
      background: var(--bg-subtle);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
    }

    .timeline-week-title {
      font-weight: 700;
      font-size: 1rem;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .timeline-week-body {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ==========================================================================
       VIEW 3: MINIMAL TABLE
       ========================================================================== */
    .table-box {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      overflow-x: auto;
      box-shadow: var(--shadow-soft);
    }

    .clean-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.86rem;
    }

    .clean-table th {
      background: var(--bg-subtle);
      padding: 12px 14px;
      font-weight: 700;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-subtle);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .clean-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .clean-table tr:hover td {
      background: var(--bg-hover);
    }

    /* ==========================================================================
       MODAL - CHỈNH SỬA TRỰC TIẾP (EDITABLE MODAL)
       ========================================================================== */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(30, 26, 23, 0.55);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-sheet {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 660px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 40px rgba(0,0,0,0.18);
      display: flex;
      flex-direction: column;
    }

    .modal-head {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .modal-close {
      background: transparent;
      border: none;
      font-size: 1.25rem;
      color: var(--text-faint);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
    }
    .modal-close:hover {
      color: var(--text-main);
      background: var(--bg-hover);
    }

    .modal-body {
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .edit-field-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .edit-label {
      font-size: 0.78rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Assignee Selector Toggles inside Modal */
    .assignee-select-track {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      background: var(--bg-subtle);
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
    }

    .assignee-toggle-pill {
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid var(--border-strong);
      background: var(--bg-card);
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .assignee-toggle-pill:hover {
      border-color: var(--brand);
      background: var(--bg-hover);
    }

    .assignee-toggle-pill.selected {
      background: var(--brand);
      color: #FFFFFF;
      border-color: var(--brand);
      box-shadow: 0 2px 6px rgba(36, 76, 55, 0.25);
    }

    .edit-grid-2col {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .edit-input {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.88rem;
      outline: none;
    }
    .edit-input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px var(--brand-light);
    }

    .desc-textarea {
      width: 100%;
      min-height: 90px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-page);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.88rem;
      line-height: 1.5;
      resize: vertical;
      outline: none;
    }
    .desc-textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px var(--brand-light);
    }

    .modal-foot {
      padding: 16px 24px;
      background: var(--bg-subtle);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn-save-modal {
      padding: 8px 18px;
      border-radius: 8px;
      background: var(--brand);
      color: #FFFFFF;
      border: none;
      font-weight: 700;
      font-size: 0.86rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(36, 76, 55, 0.25);
    }
    .btn-save-modal:hover {
      background: var(--brand-hover);
    }

    .btn-cancel-modal {
      padding: 8px 14px;
      border-radius: 8px;
      background: var(--bg-card);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
      font-weight: 600;
      font-size: 0.86rem;
      cursor: pointer;
    }

    .toast-notice {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--brand);
      color: #FFFFFF;
      padding: 12px 20px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      font-size: 0.88rem;
      font-weight: 600;
      display: none;
      align-items: center;
      gap: 10px;
      z-index: 2000;
      animation: slideUp 0.2s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(12px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .empty-state {
      padding: 50px 20px;
      text-align: center;
      color: var(--text-faint);
    }
  </style>

  <!-- Data Bundle -->
  <script src="data/bundle.js"></script>
</head>
<body>

  <div class="container">
    <!-- TOP NAVIGATION -->
    <header class="top-nav">
      <div class="brand-wrap">
        <div class="brand-logo">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <div>
          <h1 class="brand-name">Ssport Plan</h1>
          <div class="brand-meta">Kế hoạch & Checklist công việc tháng</div>
        </div>
      </div>

      <div class="nav-actions">
        <!-- Month Selector -->
        <div class="month-select-pill">
          <i class="fa-regular fa-calendar" style="color: var(--brand);"></i>

        <!-- Theme switcher -->
        <div class="theme-pill-group">

          <button class="theme-btn" data-theme-val="dark"><i class="fa-regular fa-moon"></i> Tối</button>

        <button id="downloadBundleBtn" class="btn-text-icon" title="Tải file dữ liệu mới để cập nhật GitHub cho cả công ty">

        </button>

        <button id="resetBtn" class="btn-text-icon" title="Khôi phục trạng thái ban đầu">
          <i class="fa-solid fa-rotate-left"></i> Khôi phục
        </button>

        <a href="https://docs.google.com/spreadsheets/d/1GKT_j-gHnZRwcpnrzEKlkSWQ0Sa2TbLYDxefyBi_OO8/edit?gid=1548491598#gid=1548491598" target="_blank" class="btn-text-icon">
          <i class="fa-solid fa-arrow-up-right-from-square"></i> Sheet gốc
        </a>
      </div>
    </header>

    <!-- COMPACT KPI STRIP -->
    <div class="kpi-strip">
      <div class="kpi-metrics-wrap">
        <div class="kpi-metric-item">
          <span class="kpi-dot" style="background: var(--text-main);"></span>
          <span class="label">Tổng cộng:</span>
          <span id="kpiTotal" class="val">0</span>
        </div>
        <div class="kpi-metric-item">
          <span class="kpi-dot" style="background: #DC2626;"></span>
          <span class="label">Quá hạn:</span>
          <span id="kpiOverdue" class="val" style="color: #DC2626;">0</span>
        </div>
        <div class="kpi-metric-item">
          <span class="kpi-dot" style="background: #0284C7;"></span>
          <span class="label">Đang làm:</span>
          <span id="kpiDoing" class="val" style="color: #0284C7;">0</span>
        </div>
        <div class="kpi-metric-item">
          <span class="kpi-dot" style="background: #64748B;"></span>
          <span class="label">Lên lịch:</span>
          <span id="kpiSched" class="val" style="color: #64748B;">0</span>
        </div>
        <div class="kpi-metric-item">
          <span class="kpi-dot" style="background: #16A34A;"></span>
          <span class="label">Đã xong:</span>
          <span id="kpiDone" class="val" style="color: #16A34A;">0</span>
        </div>
      </div>

      <div class="kpi-progress-bar-wrap">
        <div class="kpi-bar-track">
          <div id="barDone" class="kpi-bar-fill-done" style="width: 0%;"></div>
          <div id="barDoing" class="kpi-bar-fill-doing" style="width: 0%;"></div>
          <div id="barOverdue" class="kpi-bar-fill-overdue" style="width: 0%;"></div>
          <div id="barSched" class="kpi-bar-fill-sched" style="width: 0%;"></div>
        </div>
        <span id="pctText" style="font-family: var(--font-mono); font-size: 0.86rem; font-weight: 700; color: var(--brand);">0%</span>
      </div>
    </div>

    <!-- AVATAR TRACK (CHỌN NHÂN SỰ GỌN GÀNG) -->
    <div class="avatar-filter-section">
      <div class="avatar-filter-title">
        <span><i class="fa-solid fa-user-check"></i> Chọn nhân sự để xem việc riêng:</span>
        <span id="activeFilterDesc" style="color: var(--brand); font-weight: 600; text-transform: none;">Đang xem tất cả</span>
      </div>
      <div class="avatar-chips-track" id="avatarChipsTrack"></div>
    </div>

    <!-- TOOLBAR & VIEW SELECTOR -->
    <div class="toolbar-row">
      <div class="search-input-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchField" class="search-field" placeholder="Tìm kiếm nhanh việc, KPI, dự án...">
      </div>

      <div class="secondary-filters">
        <select id="projectSelect" class="filter-select">
          <option value="all">Tất cả dự án</option>
        </select>

        <select id="statusSelect" class="filter-select">
          <option value="all">Tất cả trạng thái</option>
          <option value="Quá hạn">Quá hạn</option>
          <option value="Đang thực hiện">Đang thực hiện</option>
          <option value="Lên lịch">Lên lịch</option>
          <option value="Hoàn thành">Đã hoàn thành</option>
        </select>

        <div class="view-switcher">
          <button class="view-btn active" data-view="focus" title="Xem theo mức độ gấp (Rất dễ theo dõi)">
            <i class="fa-solid fa-bullseye"></i> Tiêu điểm
          </button>
          <button class="view-btn" data-view="week" title="Xem chia theo 4 tuần">
            <i class="fa-regular fa-calendar-days"></i> Theo Tuần
          </button>
          <button class="view-btn" data-view="table" title="Dạng danh sách bảng phẳng">
            <i class="fa-solid fa-list-check"></i> Danh sách
          </button>
        </div>
      </div>
    </div>

    <!-- MAIN VIEW AREA -->
    <main id="mainViewArea"></main>

  </div>

  <!-- MODAL DETAIL & DIRECT IN-PLACE EDITING -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal-sheet">
      <div class="modal-head">
        <div style="flex: 1;">
          <div style="display: flex; gap: 6px; align-items: center; margin-bottom: 6px; flex-wrap: wrap;">
            <span id="mStt" style="font-family: var(--font-mono); font-size: 0.76rem; font-weight: 700; color: var(--text-faint);">#STT</span>
            <span id="mProject" class="project-pill" style="font-size: 0.74rem;">Dự án</span>
            <span id="mEditedBadge" class="edited-indicator" style="display: none;"><i class="fa-solid fa-pen"></i> Đã sửa</span>
          </div>
          <h2 id="mTitle" style="font-size: 1.15rem; font-weight: 700; color: var(--text-main); line-height: 1.35;">Tiêu đề</h2>
        </div>
        <button id="mCloseBtn" class="modal-close"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="modal-body">
        <!-- 1. GÁN LẠI NGƯỜI PHỤ TRÁCH (CHỌN TRỰC TIẾP TỪNG NGƯỜI) -->
        <div class="edit-field-block">
          <div class="edit-label">
            <span><i class="fa-solid fa-user-tag" style="color: var(--brand);"></i> Người phụ trách (Bấm chọn / bỏ chọn):</span>
            <span id="mAssigneeSummary" style="font-size: 0.76rem; color: var(--brand); font-weight: 700;">-</span>
          </div>
          <div class="assignee-select-track" id="mAssigneePillsTrack">
            <!-- 8 Team Members: An, Duyên, Dương, Hiền, Ngọc, Thắng, Trang, Đức -->
          </div>
        </div>

        <!-- 2. HẠN CHÓT & MỨC ƯU TIÊN & TRẠNG THÁI -->
        <div class="edit-grid-2col">
          <div class="edit-field-block">
            <label class="edit-label">Hạn chót (Deadline):</label>
            <input type="text" id="mDeadlineInput" class="edit-input" placeholder="VD: 15/11/26">
          </div>

          <div class="edit-field-block">
            <label class="edit-label">Giờ chót:</label>
            <input type="text" id="mDeadlineTimeInput" class="edit-input" placeholder="VD: 17:00">
          </div>
        </div>

        <div class="edit-grid-2col">
          <div class="edit-field-block">
            <label class="edit-label">Trạng thái công việc:</label>
            <select id="mStatusSelect" class="edit-input">
              <option value="Quá hạn">🔴 Quá hạn / Cần gỡ</option>
              <option value="Đang thực hiện">🔵 Đang thực hiện</option>
              <option value="Lên lịch">⚪ Lên lịch</option>
              <option value="Hoàn thành">🟢 Đã hoàn thành</option>
            </select>
          </div>

          <div class="edit-field-block">
            <label class="edit-label">Mức độ ưu tiên:</label>
            <select id="mLevelSelect" class="edit-input">
              <option value="Rất cao">Rất cao (Gấp)</option>
              <option value="Cao">Cao</option>
              <option value="TB">Trung bình (TB)</option>
            </select>
          </div>
        </div>

        <!-- 3. MÔ TẢ CHI TIẾT & KPI -->
        <div class="edit-field-block">
          <label class="edit-label"><i class="fa-solid fa-file-pen"></i> Mô tả chi tiết, KPI & Hướng xử lý:</label>
          <textarea id="mDescTextarea" class="desc-textarea" placeholder="Nhập KPI hoặc hướng giải quyết..."></textarea>
        </div>
      </div>

      <div class="modal-foot">
        <div style="display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="mDoneCheck" class="task-checkbox-custom">
          <label for="mDoneCheck" style="font-size: 0.86rem; font-weight: 600; cursor: pointer;">Đã hoàn thành</label>
        </div>

        <div style="display: flex; gap: 8px;">
          <button id="mCancelBtn" class="btn-cancel-modal">Hủy</button>
          <button id="mSaveBtn" class="btn-save-modal">
            <i class="fa-solid fa-floppy-disk"></i> Lưu thay đổi
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toastNotice" class="toast-notice">
    <i class="fa-solid fa-circle-check"></i>
    <span id="toastMsg">Đã lưu thay đổi thành công!</span>
  </div>

  <script>
    const TEAM_MEMBERS = ['An', 'Duyên', 'Dương', 'Hiền', 'Ngọc', 'Thắng', 'Trang', 'Đức'];
    const DB = window.SSPORT_DATABASE || { months: [], tasks: {} };

    let currentMonth = DB.months.find(m => m.is_current)?.id || '2026-11';
    let currentTasks = [];
    let taskOverridesMap = {}; // stores custom edits per month { stt: { assignee, end_date, deadline_time, status, level, desc, done } }

    let activeAssignee = 'all';
    let activeProject = 'all';
    let activeStatus = 'all';
    let activeSearch = '';
    let currentView = 'focus';
    let activeModalStt = null;

    // Temporary modal state for selected assignees
    let modalSelectedAssignees = new Set();

    function getStorageKey() {
      return `ssport_tasks_overrides_${currentMonth}`;
    }

    function showToast(msg) {
      const toast = document.getElementById('toastNotice');
      document.getElementById('toastMsg').innerText = msg;
      toast.style.display = 'flex';
      setTimeout(() => { toast.style.display = 'none'; }, 2600);
    }

    function loadMonth(monthId) {
      currentMonth = monthId;
      taskOverridesMap = JSON.parse(localStorage.getItem(getStorageKey()) || '{}');

      const rawList = DB.tasks[monthId] || [];
      currentTasks = rawList.map(raw => {
        const override = taskOverridesMap[raw.stt] || {};
        const isDone = override.done !== undefined ? override.done : (raw.done || false);
        const status = override.status || (isDone ? 'Hoàn thành' : raw.status);
        const assignee = override.assignee !== undefined ? override.assignee : raw.assignee;
        const endDate = override.end_date !== undefined ? override.end_date : raw.end_date;
        const deadlineTime = override.deadline_time !== undefined ? override.deadline_time : raw.deadline_time;
        const level = override.level !== undefined ? override.level : raw.level;
        const desc = override.desc !== undefined ? override.desc : raw.desc;

        return {
          ...raw,
          assignee: assignee,
          end_date: endDate,
          deadline_time: deadlineTime,
          level: level,
          desc: desc,
          status: status,
          done: isDone,
          is_edited: Object.keys(override).length > 0
        };
      });

      populateFilters();
      updateKpis();
      renderMain();
    }

    function populateMonthSelect() {
      const select = document.getElementById('monthSelect');
      select.innerHTML = '';
      DB.months.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.id;
        opt.innerText = m.label;
        if (m.id === currentMonth) opt.selected = true;
        select.appendChild(opt);
      });
      select.addEventListener('change', (e) => loadMonth(e.target.value));
    }

    function populateFilters() {
      // Collect all assignees from current tasks + TEAM_MEMBERS
      const allAssignees = Array.from(new Set([...TEAM_MEMBERS])).sort();

      const track = document.getElementById('avatarChipsTrack');
      track.innerHTML = `
        <div class="avatar-chip ${activeAssignee === 'all' ? 'active' : ''}" data-val="all">
          <div class="avatar-circle"><i class="fa-solid fa-users"></i></div>
          <span class="avatar-name">Tất cả</span>
          <span class="avatar-badge-count">${currentTasks.length}</span>
        </div>
      `;

      allAssignees.forEach(name => {
        const count = currentTasks.filter(t => t.assignee.split(',').map(s => s.trim()).includes(name)).length;
        const chip = document.createElement('div');
        chip.className = `avatar-chip ${activeAssignee === name ? 'active' : ''}`;
        chip.setAttribute('data-val', name);
        chip.innerHTML = `
          <div class="avatar-circle">${name.charAt(0)}</div>
          <span class="avatar-name">${name}</span>
          <span class="avatar-badge-count">${count}</span>
        `;
        track.appendChild(chip);
      });

      track.querySelectorAll('.avatar-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          track.querySelectorAll('.avatar-chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          activeAssignee = chip.getAttribute('data-val');
          document.getElementById('activeFilterDesc').innerText = activeAssignee === 'all' ? 'Đang xem tất cả nhân sự' : `Đang lọc: ${activeAssignee}`;
          renderMain();
        });
      });

      // Project dropdown
      const pSelect = document.getElementById('projectSelect');
      const projects = Array.from(new Set(currentTasks.map(t => t.project).filter(Boolean))).sort();
      pSelect.innerHTML = `<option value="all">Tất cả dự án (${projects.length})</option>`;
      projects.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p;
        opt.innerText = p;
        pSelect.appendChild(opt);
      });
    }

    function updateKpis() {
      const total = currentTasks.length;
      const done = currentTasks.filter(t => t.done || t.status === 'Hoàn thành').length;
      const overdue = currentTasks.filter(t => t.status === 'Quá hạn' && !t.done).length;
      const doing = currentTasks.filter(t => t.status === 'Đang thực hiện' && !t.done).length;
      const sched = currentTasks.filter(t => t.status === 'Lên lịch' && !t.done).length;

      document.getElementById('kpiTotal').innerText = total;
      document.getElementById('kpiDone').innerText = done;
      document.getElementById('kpiOverdue').innerText = overdue;
      document.getElementById('kpiDoing').innerText = doing;
      document.getElementById('kpiSched').innerText = sched;

      const pct = total > 0 ? Math.round((done / total) * 100) : 0;
      document.getElementById('pctText').innerText = `${pct}%`;

      document.getElementById('barDone').style.width = `${pct}%`;
      document.getElementById('barDoing').style.width = `${Math.round((doing / total) * 100)}%`;
      document.getElementById('barOverdue').style.width = `${Math.round((overdue / total) * 100)}%`;
      document.getElementById('barSched').style.width = `${Math.round((sched / total) * 100)}%`;
    }

    function getFilteredList() {
      let list = [...currentTasks];

      if (activeSearch) {
        const q = activeSearch.toLowerCase();
        list = list.filter(t => 
          (t.task && t.task.toLowerCase().includes(q)) ||
          (t.project && t.project.toLowerCase().includes(q)) ||
          (t.desc && t.desc.toLowerCase().includes(q)) ||
          (t.assignee && t.assignee.toLowerCase().includes(q))
        );
      }

      if (activeAssignee !== 'all') {
        list = list.filter(t => t.assignee.split(',').map(s => s.trim()).includes(activeAssignee));
      }

      if (activeProject !== 'all') {
        list = list.filter(t => t.project === activeProject);
      }

      if (activeStatus !== 'all') {
        list = list.filter(t => t.status === activeStatus);
      }

      return list;
    }

    function renderTaskCard(t) {
      const isDone = t.done || t.status === 'Hoàn thành';
      const isOverdue = t.status === 'Quá hạn' && !isDone;

      return `
        <div class="task-card-row ${isDone ? 'is-done' : ''}" onclick="openModal(${t.stt})">
          <div class="task-left-col">
            <input type="checkbox" class="task-checkbox-custom" ${isDone ? 'checked' : ''} onclick="event.stopPropagation(); quickToggleDone(${t.stt})">
            <span class="task-stt">#${t.stt}</span>
            <div class="task-title-wrap">
              <div class="task-name">${t.task}</div>
              <div class="task-meta-sub">
                <span class="project-pill">${t.project}</span>
                <span>• Hạn: <b>${t.end_date || '-'}</b> (${t.deadline_time || '17:00'})</span>
                ${t.days_left ? `<span style="color: ${isOverdue ? '#DC2626' : 'inherit'}; font-weight: 600;">• ${t.days_left}</span>` : ''}
                ${t.is_edited ? `<span class="edited-indicator"><i class="fa-solid fa-pen"></i> Đã sửa</span>` : ''}
              </div>
            </div>
          </div>
          <div class="task-right-col">
            <div class="assignee-avatar-group">
              ${t.assignee ? t.assignee.split(',').map(a => `<span class="assignee-badge">${a.trim()}</span>`).join('') : '<span class="assignee-badge" style="color:#DC2626; background:#FEE2E2;">Chưa gán</span>'}
            </div>
            <span class="deadline-badge ${isOverdue ? 'overdue' : 'normal'}">
              ${t.status}
            </span>
          </div>
        </div>
      `;
    }

    // View 1: Focus View
    function renderFocusView(tasks) {
      const overdue = tasks.filter(t => t.status === 'Quá hạn' && !t.done);
      const doing = tasks.filter(t => t.status === 'Đang thực hiện' && !t.done);
      const sched = tasks.filter(t => t.status === 'Lên lịch' && !t.done);
      const done = tasks.filter(t => t.done || t.status === 'Hoàn thành');

      let html = '';

      if (overdue.length > 0) {
        html += `
          <div class="focus-group">
            <div class="focus-group-header">
              <div class="focus-icon-circle" style="background: #FEE2E2; color: #DC2626;"><i class="fa-solid fa-triangle-exclamation"></i></div>
              <div class="focus-title" style="color: #991B1B;">Cần giải quyết gấp / Quá hạn</div>
              <span class="focus-count" style="color: #DC2626; font-weight: 700;">${overdue.length}</span>
            </div>
            <div class="task-cards-list">${overdue.map(renderTaskCard).join('')}</div>
          </div>
        `;
      }

      if (doing.length > 0) {
        html += `
          <div class="focus-group">
            <div class="focus-group-header">
              <div class="focus-icon-circle" style="background: #E0F2FE; color: #0284C7;"><i class="fa-solid fa-spinner"></i></div>
              <div class="focus-title" style="color: #075985;">Đang triển khai tuần này</div>
              <span class="focus-count">${doing.length}</span>
            </div>
            <div class="task-cards-list">${doing.map(renderTaskCard).join('')}</div>
          </div>
        `;
      }

      if (sched.length > 0) {
        html += `
          <div class="focus-group">
            <div class="focus-group-header">
              <div class="focus-icon-circle" style="background: #F1F5F9; color: #64748B;"><i class="fa-solid fa-calendar-days"></i></div>
              <div class="focus-title" style="color: #475569;">Kế hoạch các mốc tới</div>
              <span class="focus-count">${sched.length}</span>
            </div>
            <div class="task-cards-list">${sched.map(renderTaskCard).join('')}</div>
          </div>
        `;
      }

      if (done.length > 0) {
        html += `
          <div class="focus-group">
            <div class="focus-group-header">
              <div class="focus-icon-circle" style="background: #E8F5E9; color: #16A34A;"><i class="fa-solid fa-check"></i></div>
              <div class="focus-title" style="color: #166534;">Đã hoàn thành</div>
              <span class="focus-count">${done.length}</span>
            </div>
            <div class="task-cards-list">${done.map(renderTaskCard).join('')}</div>
          </div>
        `;
      }

      if (html === '') {
        html = `<div class="empty-state"><i class="fa-solid fa-circle-check" style="font-size: 2.5rem; color: #16A34A; margin-bottom: 12px;"></i><p>Không có đầu việc nào phù hợp với bộ lọc.</p></div>`;
      }

      return html;
    }

    // View 2: Timeline Week View
    function renderWeekView(tasks) {
      const getWeek = (dateStr) => {
        if (!dateStr) return 4;
        const day = parseInt(dateStr.split('/')[0]);
        if (day <= 8) return 1;
        if (day <= 15) return 2;
        if (day <= 22) return 3;
        return 4;
      };

      const weeks = [
        { id: 1, title: 'Tuần 1 (02/11 - 08/11)', desc: 'Chốt dữ liệu đầu vào, liên hệ công nợ & giải LTV' },
        { id: 2, title: 'Tuần 2 (09/11 - 15/11)', desc: 'Thu cọc đồng phục, phát cam kết Foxes, chốt TH ĐBP' },
        { id: 3, title: 'Tuần 3 (16/11 - 22/11)', desc: 'Thu 100% tiền giải, giải Him Lam, thu tiền Foxes' },
        { id: 4, title: 'Tuần 4 (23/11 - 30/11)', desc: 'Giao đồng phục, chốt công nợ & tổng kết tháng' }
      ];

      let html = '';
      weeks.forEach(w => {
        const wTasks = tasks.filter(t => getWeek(t.end_date) === w.id);
        const doneCount = wTasks.filter(t => t.done || t.status === 'Hoàn thành').length;

        html += `
          <div class="timeline-week-card">
            <div class="timeline-week-header">
              <div>
                <div class="timeline-week-title"><i class="fa-solid fa-flag" style="color: var(--brand);"></i> ${w.title}</div>
                <div style="font-size: 0.78rem; color: var(--text-muted); margin-top: 2px;">${w.desc}</div>
              </div>
              <div style="font-family: var(--font-mono); font-weight: 700; font-size: 0.82rem; color: var(--brand);">
                ${doneCount}/${wTasks.length} việc
              </div>
            </div>
            <div class="timeline-week-body">
              ${wTasks.length > 0 ? wTasks.map(renderTaskCard).join('') : '<div style="font-size: 0.8rem; color: var(--text-faint); padding: 8px 0;">Không có việc trong tuần này.</div>'}
            </div>
          </div>
        `;
      });

      return html;
    }

    // View 3: Clean Table View
    function renderTableView(tasks) {
      if (tasks.length === 0) return `<div class="empty-state"><p>Không có dữ liệu.</p></div>`;

      let rows = tasks.map(t => {
        const isDone = t.done || t.status === 'Hoàn thành';
        return `
          <tr style="cursor: pointer; opacity: ${isDone ? 0.6 : 1};" onclick="openModal(${t.stt})">
            <td style="text-align: center;" onclick="event.stopPropagation();">
              <input type="checkbox" class="task-checkbox-custom" ${isDone ? 'checked' : ''} onchange="quickToggleDone(${t.stt})">
            </td>
            <td style="font-family: var(--font-mono); font-weight: 600; color: var(--text-faint);">${t.stt}</td>
            <td><span class="project-pill">${t.project}</span></td>
            <td>
              <div style="font-weight: 600; color: var(--text-main); ${isDone ? 'text-decoration: line-through;' : ''}">${t.task}</div>
            </td>
            <td>
              <div style="display: flex; gap: 4px; flex-wrap: wrap;">
                ${t.assignee ? t.assignee.split(',').map(a => `<span class="assignee-badge">${a.trim()}</span>`).join('') : '<span style="color:#DC2626;">Chưa gán</span>'}
              </div>
            </td>
            <td style="font-family: var(--font-mono); font-size: 0.8rem;">
              <b>${t.end_date || '-'}</b>
              <div style="font-size: 0.7rem; color: var(--text-faint);">${t.deadline_time || '17:00'}</div>
            </td>
            <td>
              <span class="deadline-badge ${t.status === 'Quá hạn' && !isDone ? 'overdue' : 'normal'}">${t.status}</span>
            </td>
          </tr>
        `;
      }).join('');

      return `
        <div class="table-box">
          <table class="clean-table">
            <thead>
              <tr>
                <th style="width: 44px; text-align: center;">Xong</th>
                <th style="width: 44px;">STT</th>
                <th>Dự án</th>
                <th>Nhiệm vụ</th>
                <th>Phụ trách</th>
                <th>Hạn chót</th>
                <th>Trạng thái</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    function renderMain() {
      const area = document.getElementById('mainViewArea');
      const tasks = getFilteredList();

      if (currentView === 'focus') area.innerHTML = renderFocusView(tasks);
      else if (currentView === 'week') area.innerHTML = renderWeekView(tasks);
      else if (currentView === 'table') area.innerHTML = renderTableView(tasks);
    }

    function quickToggleDone(stt) {
      const t = currentTasks.find(x => x.stt === stt);
      if (!t) return;

      const newDone = !t.done;
      t.done = newDone;
      if (newDone) t.status = 'Hoàn thành';
      else {
        const raw = (DB.tasks[currentMonth] || []).find(x => x.stt === stt);
        t.status = raw ? raw.status : 'Đang thực hiện';
      }

      if (!taskOverridesMap[stt]) taskOverridesMap[stt] = {};
      taskOverridesMap[stt].done = newDone;
      taskOverridesMap[stt].status = t.status;
      localStorage.setItem(getStorageKey(), JSON.stringify(taskOverridesMap));

      updateKpis();
      renderMain();
    }

    // OPEN EDITABLE MODAL
    function openModal(stt) {
      const t = currentTasks.find(x => x.stt === stt);
      if (!t) return;
      activeModalStt = stt;

      document.getElementById('mStt').innerText = '#' + t.stt;
      document.getElementById('mProject').innerText = t.project;
      document.getElementById('mTitle').innerText = t.task;
      document.getElementById('mEditedBadge').style.display = t.is_edited ? 'inline-flex' : 'none';

      // 1. Assignee pills setup
      modalSelectedAssignees = new Set(t.assignee.split(',').map(s => s.trim()).filter(Boolean));
      renderModalAssigneePills();

      // 2. Deadline & Level & Status
      document.getElementById('mDeadlineInput').value = t.end_date || '';
      document.getElementById('mDeadlineTimeInput').value = t.deadline_time || '17:00';
      document.getElementById('mStatusSelect').value = t.status || 'Đang thực hiện';
      document.getElementById('mLevelSelect').value = t.level || 'TB';
      document.getElementById('mDescTextarea').value = t.desc || '';
      document.getElementById('mDoneCheck').checked = t.done || t.status === 'Hoàn thành';

      document.getElementById('modalOverlay').style.display = 'flex';
    }

    function renderModalAssigneePills() {
      const track = document.getElementById('mAssigneePillsTrack');
      track.innerHTML = '';

      TEAM_MEMBERS.forEach(name => {
        const isSel = modalSelectedAssignees.has(name);
        const pill = document.createElement('div');
        pill.className = `assignee-toggle-pill ${isSel ? 'selected' : ''}`;
        pill.innerHTML = `
          <i class="fa-solid ${isSel ? 'fa-check' : 'fa-plus'}"></i>
          <span>${name}</span>
        `;
        pill.addEventListener('click', () => {
          if (modalSelectedAssignees.has(name)) {
            modalSelectedAssignees.delete(name);
          } else {
            modalSelectedAssignees.add(name);
          }
          renderModalAssigneePills();
        });
        track.appendChild(pill);
      });

      const summaryList = Array.from(modalSelectedAssignees);
      document.getElementById('mAssigneeSummary').innerText = summaryList.length > 0 ? summaryList.join(', ') : '(Chưa chọn ai)';
    }

    function closeModal() {
      document.getElementById('modalOverlay').style.display = 'none';
      activeModalStt = null;
    }

    function saveModalChanges() {
      if (!activeModalStt) return;
      const t = currentTasks.find(x => x.stt === activeModalStt);
      if (!t) return;

      const newAssigneeStr = Array.from(modalSelectedAssignees).join(', ');
      const newEndDate = document.getElementById('mDeadlineInput').value.trim();
      const newDeadlineTime = document.getElementById('mDeadlineTimeInput').value.trim();
      const newStatus = document.getElementById('mStatusSelect').value;
      const newLevel = document.getElementById('mLevelSelect').value;
      const newDesc = document.getElementById('mDescTextarea').value.trim();
      const newDone = document.getElementById('mDoneCheck').checked || (newStatus === 'Hoàn thành');

      // Update in memory
      t.assignee = newAssigneeStr;
      t.end_date = newEndDate;
      t.deadline_time = newDeadlineTime;
      t.status = newDone ? 'Hoàn thành' : newStatus;
      t.level = newLevel;
      t.desc = newDesc;
      t.done = newDone;
      t.is_edited = true;

      // Save to localStorage
      if (!taskOverridesMap[activeModalStt]) taskOverridesMap[activeModalStt] = {};
      taskOverridesMap[activeModalStt] = {
        assignee: newAssigneeStr,
        end_date: newEndDate,
        deadline_time: newDeadlineTime,
        status: t.status,
        level: newLevel,
        desc: newDesc,
        done: newDone
      };
      localStorage.setItem(getStorageKey(), JSON.stringify(taskOverridesMap));

      closeModal();
      populateFilters();
      updateKpis();
      renderMain();
      showToast('Đã lưu thay đổi cho việc #' + activeModalStt + '!');
    }

    // DOWNLOAD UPDATED BUNDLE.JS FOR GITHUB
    function downloadUpdatedBundle() {
      // Merge all overrides into DB.tasks[currentMonth]
      const updatedTasks = currentTasks.map(t => {
        const copy = { ...t };
        delete copy.is_edited;
        return copy;
      });

      const exportDB = {
        months: DB.months,
        tasks: {
          ...DB.tasks,
          [currentMonth]: updatedTasks
        }
      };

      const fileContent = `// Ssport Multi-Month Data Bundle (Updated)
window.SSPORT_DATABASE = ${JSON.stringify(exportDB, null, 2)};
`;
      const blob = new Blob([fileContent], { type: 'application/javascript;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'bundle.js';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);

      showToast('Đã tải file bundle.js cập nhật! Chị có thể kéo vào GitHub để đồng bộ cho cả công ty.');
    }

    document.addEventListener('DOMContentLoaded', () => {
      populateMonthSelect();
      loadMonth(currentMonth);

      // Search & Filters
      document.getElementById('searchField').addEventListener('input', (e) => {
        activeSearch = e.target.value.trim();
        renderMain();
      });

      document.getElementById('projectSelect').addEventListener('change', (e) => {
        activeProject = e.target.value;
        renderMain();
      });

      document.getElementById('statusSelect').addEventListener('change', (e) => {
        activeStatus = e.target.value;
        renderMain();
      });

      // View Switcher
      document.querySelectorAll('.view-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentView = btn.getAttribute('data-view');
          renderMain();
        });
      });

      // Theme toggle
      document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const th = btn.getAttribute('data-theme-val');
          document.documentElement.setAttribute('data-theme', th);
          localStorage.setItem('ssport_theme', th);
        });
      });
      const savedTheme = localStorage.getItem('ssport_theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
      document.querySelectorAll('.theme-btn').forEach(b => {
        if (b.getAttribute('data-theme-val') === savedTheme) b.classList.add('active');
        else b.classList.remove('active');
      });

      // Reset
      document.getElementById('resetBtn').addEventListener('click', () => {
        if (confirm(`Bạn muốn khôi phục lại trạng thái ban đầu từ Google Sheet?`)) {
          localStorage.removeItem(getStorageKey());
          loadMonth(currentMonth);
          showToast('Đã khôi phục dữ liệu gốc!');
        }
      });

      // Download Bundle
      document.getElementById('downloadBundleBtn').addEventListener('click', downloadUpdatedBundle);

      // Modal Events
      document.getElementById('mCloseBtn').addEventListener('click', closeModal);
      document.getElementById('mCancelBtn').addEventListener('click', closeModal);
      document.getElementById('mSaveBtn').addEventListener('click', saveModalChanges);
      document.getElementById('modalOverlay').addEventListener('click', (e) => {
        if (e.target.id === 'modalOverlay') closeModal();
      });
    });
  </script>
</body>
</html>
